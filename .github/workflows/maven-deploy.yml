# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Deploy `at_client` to Central Portal

on:
  push:
    branches:
      - trunk

permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  deploy:
    defaults:
      run:
        working-directory: at_client
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up JDK 8
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '8'
        distribution: 'adopt'
        server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
        server-username: "CENTRAL_USERNAME" # env variable for username in deploy
        server-password: "CENTRAL_TOKEN" # env variable for token in deploy
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }} # Value of the GPG private key to import
        gpg-passphrase: "GPG_PASSPHRASE" # env variable for GPG private key passphrase

    - name: Print folder
      run: ls -al .

    - name: Print m2 settings
      continue-on-error: true
      run: cat ~/.m2/settings.xml

    - name: Publish to Central
      run: |
        mvn \
        deploy \
        --batch-mode \
        --no-transfer-progress \
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}