services:
  virtualenv:
    image: atsigncompany/virtualenv:dev_env
    ports:
      - '127.0.0.1:6379:6379'
      - '64:64'
      - '443:443'
      - '127.0.0.1:9001:9001'
      - '25000-25999:25000-25999'
    extra_hosts:
      - "vip.ve.atsign.zone:127.0.0.1"
    environment:
      DART_VM_OPTIONS: "--use_compactor,--force_evacuation,--idle_duration_micros=0,--compactor_tasks=5,--marker_tasks=5,--scavenger_tasks=5,--old_gen_growth_time_ratio=50,--old_gen_growth_space_ratio=10"
    command: >
      sh -c '
        supervisord -n & PID=$! &&
        sleep 5 &&
        /usr/local/bin/install_PKAM_Keys
        wait $PID
      '
